services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud_tracing_db
    restart: always
    environment:
      POSTGRES_DB: fraud_tracing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_9981}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=64MB
      -c maintenance_work_mem=128MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud_tracing_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fraud_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud_tracing_backend
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_tracing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_9981}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraud_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud_tracing_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fraud_net

volumes:
  pgdata:

networks:
  fraud_net:
    driver: bridge
